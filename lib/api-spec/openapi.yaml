openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: Work session operations
  - name: insights
    description: Time summaries and projects
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List work sessions
      parameters:
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Work sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createService
      tags: [services]
      summary: Start a work session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Started work session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A work session is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Edit a work period
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated work period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a work period
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "204":
          description: Work period deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /services/{id}/finish:
    post:
      operationId: finishService
      tags: [services]
      summary: Finish a running work session
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Finished work session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /services/{id}/pause:
    post:
      operationId: toggleServicePause
      tags: [services]
      summary: Pause or resume a work period
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Paused or resumed work period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [insights]
      summary: Get dashboard data
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /summary:
    get:
      operationId: getSummary
      tags: [insights]
      summary: Get time summary
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: Time summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/{id}:
    delete:
      operationId: deleteProject
      tags: [insights]
      summary: Delete a project and its work periods
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
      responses:
        "204":
          description: Project deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects:
    post:
      operationId: createProject
      tags: [insights]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Project already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listProjects
      tags: [insights]
      summary: List project names
      responses:
        "200":
          description: Project names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Period:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [today, week, month, all, custom]
        default: month
    ProjectId:
      name: projectId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StartDate:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Service:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        projectId:
          type: ["integer", "null"]
        projectTitle:
          type: string
        subtitle:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        durationSeconds:
          type: integer
        elapsedSeconds:
          type: integer
        pausedDurationSeconds:
          type: integer
        pauseStartedAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [running, paused, completed]
        createdAt:
          type: string
          format: date-time
      required: [id, title, projectId, projectTitle, subtitle, startedAt, endedAt, durationSeconds, elapsedSeconds, pausedDurationSeconds, pauseStartedAt, status, createdAt]
    ServiceInput:
      type: object
      properties:
        projectId:
          type: integer
          minimum: 1
        subtitle:
          type: string
        description:
          type: string
      required: [projectId]
    ServiceUpdate:
      type: object
      properties:
        subtitle:
          type: string
        description:
          type: ["string", "null"]
    SummaryPeriod:
      type: object
      properties:
        seconds:
          type: integer
        label:
          type: string
      required: [seconds, label]
    Summary:
      type: object
      properties:
        today:
          $ref: "#/components/schemas/SummaryPeriod"
        week:
          $ref: "#/components/schemas/SummaryPeriod"
        month:
          $ref: "#/components/schemas/SummaryPeriod"
        all:
          $ref: "#/components/schemas/SummaryPeriod"
        project:
          $ref: "#/components/schemas/ProjectSummary"
      required: [today, week, month, all]
    Project:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        seconds:
          type: integer
        serviceCount:
          type: integer
        dayCount:
          type: integer
      required: [id, title, description, seconds, serviceCount, dayCount]
    ProjectInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
      required: [title]
    ProjectSummary:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            services:
              type: array
              items:
                $ref: "#/components/schemas/Service"
          required: [services]
    Dashboard:
      type: object
      properties:
        active:
          $ref: "#/components/schemas/Service"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        summary:
          $ref: "#/components/schemas/Summary"
      required: [recent, summary]

