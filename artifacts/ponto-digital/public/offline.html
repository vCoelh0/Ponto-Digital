<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0f" />
    <title>Sem conexão | Ponto Digital</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0d0f; color: #f9fafb; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; padding: 32px; text-align: center; background: #10151a; border: 1px solid #252b32; border-radius: 16px; }
      svg { color: #3399ff; }
      h1 { font-size: 22px; margin-top: 28px; }
      p { font-size: 14px; line-height: 1.6; color: #9ca3af; }
      button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 8px; background: #3399ff; color: #fff; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
      <p>Ponto Digital</p>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para entrar na sua conta e registrar seus períodos. Seus registros continuam salvos no servidor.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
    <script>window.addEventListener('online', () => window.location.reload());</script>
  </body>
</html>
